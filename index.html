<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulaire d'Inscription pour la Formation Microsoft Azure</title>


    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <h1>Formulaire d'Inscription</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input type="text" id="nom" name="nom" required>
            </div>
            <div class="form-group">
                <label for="prenom">Prénom</label>
                <input type="text" id="prenom" name="prenom" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telephone">Téléphone</label>
                <input type="tel" id="telephone" name="telephone" required>
            </div>
            <div class="form-group">
                <label>Sexe</label>
                <div class="radio-group">
                    <label for="homme">
                        <input type="radio" id="homme" name="sexe" value="homme" required> Homme
                    </label>
                    <label for="femme">
                        <input type="radio" id="femme" name="sexe" value="femme" required> Femme
                    </label>
                    <label for="autre">
                        <input type="radio" id="autre" name="sexe" value="autre" required> Autre
                    </label>
                </div>
            </div>
            <div class="form-group">
                <button type="submit" class="btn">S'inscrire</button>
            </div>
        </form>
    </div>
</body>
</html>
